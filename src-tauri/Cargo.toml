[package]
name = "tala"
version = "1.0.0"
description = "A calm, offline space to remember"
edition = "2024"
default-run = "tala"

[lib]
name = "tala_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-wdio = { version = "1.3.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.3.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "11", features = ["serde-json-impl"] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
fsrs = "=6.6.1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
csv = "1"
unicode-normalization = "0.1"
thiserror = "2"
log = { version = "0.4", features = ["std"] }

[dev-dependencies]
tempfile = "3"

[features]
default = []
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
